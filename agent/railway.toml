[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# ONE worker while on SQLite. Two reasons, both correctness (not scale):
#   1. SQLite is single-writer — 4 processes writing one file on the volume
#      throw "database is locked" under concurrent calls/texts.
#   2. The per-conversation lock (locks.py) is a process-local threading lock
#      on SQLite, so it only actually serializes turns within ONE process.
# Move to Postgres (set DATABASE_URL) to safely raise this — Postgres handles
# concurrent writers and the lock becomes a cross-process pg_advisory_lock.
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# /health only fails (503) when the database itself is unreachable -- the one
# condition where every route in this app is already broken and a restart is
# the right response. A stale scheduler heartbeat or an old backup snapshot
# stays a 200 with the detail in the body, since restarting the container
# fixes neither and risks a restart loop over noise. See app.py's /health.
healthcheckPath = "/health"
healthcheckTimeout = 100
