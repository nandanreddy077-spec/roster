# Dev tooling only. Nothing here ships: Railway builds from agent/ with
# agent/requirements.txt, so this file never reaches the running image.

[tool.ruff]
# The codebase was written to ~100 columns by hand. Ruff's default of 88 would
# rewrite 1002 lines to no benefit; 100 touches 250. Match the convention that
# is already there rather than imposing a new one.
line-length = 100
target-version = "py313"
# docs/ is excluded because the formatter rewrites Python code blocks embedded
# in markdown. Those blocks are historical planning records — reformatting them
# rewrites what the code looked like at the time, which is the one thing a plan
# document exists to preserve. basecheck/ and strix_runs/ are vendored tool
# output, not ours to style.
extend-exclude = [".venv", "basecheck", "strix_runs", "docs"]

[tool.ruff.lint]
# Deliberately small: pyflakes (real bugs), pycodestyle errors, import order.
#
# Not selected, and why — each of these fights a decision this codebase made
# on purpose, and a linter that argues with the architecture gets switched off:
#   UP   274 findings, all rewriting Optional[x]/List[x] annotations. Churn.
#   DTZ  124 findings, all datetime.utcnow(). A real correctness question, but
#        one that deserves its own milestone, not a mechanical sweep.
#   BLE   29 findings. Every broad except here is a documented best-effort
#        boundary — a failed owner alert must never break a customer's turn.
select = ["E", "F", "I"]
# The formatter owns line length. E501 then only ever fires on prose in
# comments and docstrings, which the formatter cannot rewrap and which is not
# worth mangling.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py parses .env into os.environ before importing anything that reads env
# vars at import time. The import order IS the fix, not the violation.
"agent/app.py" = ["E402"]
# Tests, and only tests:
#   E402 — several suites grew by appending a section, so imports sit next to
#          the tests that use them. Not load-bearing like app.py's, just not
#          worth 13 edits and the chance of breaking a passing suite.
#   E731 — a lambda handler in a test is clearer than a def three lines above
#          the assertion it exists for.
"agent/tests/*" = ["E402", "E731"]

[tool.mypy]
python_version = "3.13"
files = ["agent"]
exclude = "(^|/)(\\.venv|basecheck|strix_runs)/"
# Third-party packages here ship no stubs (twilio, anthropic, sqlmodel plugins).
# Chasing those is not what this gate is for.
ignore_missing_imports = true
# Deliberately NOT strict. This is a largely unannotated codebase; strict mode
# reports hundreds of errors on day one, and a gate that cannot go green gets
# turned off within a week. These flags catch real defects — a wrong signature,
# an impossible comparison, a stale ignore — without demanding an annotation
# pass first. Tighten by adding one flag at a time, each with its own green CI.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# A ratchet, not a blanket. Checking everything reports 328 errors, and the
# overwhelming majority are structural rather than defects: SQLModel declares
# `id: Optional[int]`, so every `Job.id` reads as `int | None`, and SQLAlchemy's
# column descriptors (`.in_`, `.desc()`) are invisible to mypy without its
# plugin. Silencing arg-type and union-attr globally to make that go away would
# delete the single most valuable check there is — "you passed the wrong type".
#
# So mypy is ENFORCED everywhere by default, and the modules that are not clean
# yet are listed below as explicit debt. Two properties follow: a NEW file is
# type-checked from its first commit, and shortening this list is a visible,
# reviewable change rather than a config tweak nobody notices.
#
# 29 modules are already clean, including every pure-logic engine
# (lead_qualifier, dispatcher, recovery, review, membership, referral), the
# rules tables, metrics, db_models, auth, locks, channels and scheduler — which
# is to say most of the business logic.
[[tool.mypy.overrides]]
module = [
    "activation", "app", "bookings", "call_trace", "db", "engine", "expansion",
    "membership_service", "memory", "notifications", "portal", "provisioning",
    "recovery_service", "referral_service", "repositories", "review_service",
    "runner", "service", "trial_cap", "workspace", "xai_voice_adapter",
    "tests.test_dashboard_access", "tests.test_dashboard_settings",
    "tests.test_delete_client", "tests.test_employee_deploy",
    "tests.test_event_publishing", "tests.test_recovery_endpoint",
    "tests.test_recovery_service", "tests.test_review_service",
]
ignore_errors = true
