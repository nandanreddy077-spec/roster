name: CI

# Every gate here can fail the build. That is the point: before this, nothing
# checked a pull request at all, and "996 tests pass" was something a human had
# to remember to run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after the full suite.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        working-directory: agent
        run: pytest -q
        env:
          # The suite sets these per-test, but a missing default turns a real
          # assertion failure into a confusing collection error.
          ADMIN_PASSWORD: ci-admin-password
          SESSION_SECRET_KEY: ci-session-secret

  audit:
    # Separate job: a newly published CVE must not block a green pull request
    # that did not introduce it, but it does have to be visible the same day.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Known CVEs in production dependencies
        run: pip-audit -r agent/requirements.txt --progress-spinner off
