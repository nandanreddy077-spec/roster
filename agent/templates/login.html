<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Roster</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/portal.css?v={{ portal_css_version }}">
</head>
<body>
<header class="nav"><a class="logo" href="/">Roster</a></header>

<div class="portal-card">
  <h2>Welcome back</h2>
  <p class="lede">Log in to see how your team's doing.</p>

  {% if google_enabled %}
  <a class="btn btn-google" href="/auth/google/login">
    <img src="/static/google.svg" alt="" width="18" height="18"> Continue with Google
  </a>
  <div class="or-divider"><span>or</span></div>
  {% endif %}

  <form method="post" action="/login">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
    <div class="err">{{ error or "" }}</div>
  </form>
</div>
</body>
</html>
